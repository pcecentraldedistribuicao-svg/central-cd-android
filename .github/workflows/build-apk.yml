name: Build Central CD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          CENTRAL_URL: ${{ secrets.CENTRAL_URL }}
        run: gradle :app:assembleDebug -PCENTRAL_URL="$CENTRAL_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: Central-CD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
