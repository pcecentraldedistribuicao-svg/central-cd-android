name: Publish Signed Central CD APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão do app (ex.: 1.0.4)'
        required: true
        default: '1.0.4'
      version_code:
        description: 'Código inteiro crescente (ex.: 5)'
        required: true
        default: '5'
      notes:
        description: 'Notas da versão'
        required: false
        default: 'Atualização do aplicativo Android Central CD 10&CIA.'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar assinatura Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Secret ANDROID_KEYSTORE_BASE64 não configurado" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > app/central-cd-release.jks

      - name: Gerar APK release assinado
        env:
          CENTRAL_URL: ${{ secrets.CENTRAL_URL }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PCENTRAL_URL="$CENTRAL_URL" \
            -PAPP_VERSION_NAME="${{ inputs.version_name }}" \
            -PAPP_VERSION_CODE="${{ inputs.version_code }}" \
            -PRELEASE_STORE_FILE="$PWD/app/central-cd-release.jks" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "Central_CD_10CIA.apk"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version_name }}"
          APK="Central_CD_10CIA.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Central CD Android ${{ inputs.version_name }}" --notes "${{ inputs.notes }}"
          fi
